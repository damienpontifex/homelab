# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/refs/heads/main/charts/opentelemetry-collector/values.schema.json
mode: daemonset

extraVolumes:
  - name: otel-collector-config
    configMap:
      name: otel-collector-agent-config

# RBAC is managed via Kustomize ClusterRole aggregation in daemonset/rbac/
clusterRole:
  create: false

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false

service:
  enabled: true
  trafficDistribution: PreferSameNode
