# yaml-language-server: $schema=https://github.com/adobe-platform/kubernetes-json-schema/raw/refs/heads/master/master-standalone/application-argoproj-v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azure-workload-identity
  namespace: argocd
  annotations:
    # Ensure this application is deployed before any other applications that depend on the webhook being available
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: core-infra

  source:
    repoURL: https://github.com/damienpontifex/homelab.git
    path: apps/03-core-services/azure-workload-identity
    targetRevision: HEAD

  destination:
    name: in-cluster
    namespace: azure-workload-identity-system
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
