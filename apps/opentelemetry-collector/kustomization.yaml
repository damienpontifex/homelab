apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - files:
      - relay=agent/otel-config.yaml
      - common=otel-config.yaml
    name: otel-collector-agent-config
  - files:
      - relay=deployment/otel-config.yaml
      - common=otel-config.yaml
    name: otel-collector-singleton-config

resources:
  # - daemonset/mutating-admission.yaml
  # Daemonset RBAC — aggregated ClusterRole for opentelemetry-collector-daemonset
  - agent/rbac/aggregated.yaml
  - agent/rbac/kubelet-stats.yaml
  - agent/rbac/k8s-attributes.yaml
  - agent/rbac/persistent-volumes.yaml
  - agent/rbac/k8s-cluster.yaml
  # Deployment RBAC — aggregated ClusterRole for opentelemetry-collector-deployment
  - deployment/rbac/aggregated.yaml
  - deployment/rbac/k8s-events.yaml
  - deployment/rbac/k8s-objects.yaml

helmCharts:
  # - &otel-common
  #   # https://artifacthub.io/packages/helm/opentelemetry-helm/opentelemetry-collector
  #   # https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector
  #   name: opentelemetry-collector
  #   repo: https://open-telemetry.github.io/opentelemetry-helm-charts
  #   version: 0.175.1
  #   namespace: monitoring
  # releaseName: opentelemetry-collector-singleton
  # valuesFile: values.yaml
  # # additionalValuesFiles:
  # #   - deployment/values.yaml

  # - <<: *otel-common
  # Daemonset name automatically has -agent suffix
  - name: opentelemetry-collector
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.175.1
    namespace: monitoring
    releaseName: opentelemetry-collector
    valuesFile: values.yaml
    additionalValuesFiles:
      - agent/values.yaml

