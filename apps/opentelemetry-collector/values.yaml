# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/refs/heads/main/charts/opentelemetry-collector/values.schema.json

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  # repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
command:
  name: otelcol-contrib
  # name: otelcol-k8s
  extraArgs:
    - "--config=/conf/common"
    - "--config=/conf/relay"

# OTEL Config defined independently
configMap: {create: false}
# RBAC is managed via Kustomize ClusterRole aggregation in <deployment>/rbac/
clusterRole: {create: false}
# No receivers that use ports at this stage
service: {enabled: false}

extraVolumeMounts:
  - name: otel-collector-config
    mountPath: /conf
    readOnly: true

# Enable collector to get metrics from itself
podMonitor: {enabled: true}

ports:
  otlp: {enabled: false}
  otlp-http: {enabled: false}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  metrics: {enabled: true}

extraEnvs:
  - name: K8S_NODE_REGION
    valueFrom:
      fieldRef:
        fieldPath: metadata.labels['topology.kubernetes.io/region']
  - name: K8S_NODE_ZONE
    valueFrom:
      fieldRef:
        fieldPath: metadata.labels['topology.kubernetes.io/zone']
  # Pods don't carry a cluster label (only region/zone topology labels are copied
  # from the node), so a fieldRef here resolved to "". Set it explicitly.
  - name: K8S_CLUSTER_NAME
    value: homelab
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: deployment.environment.name=dev,cloud.provider=home,k8s.cluster.name=$(K8S_CLUSTER_NAME),cloud.availability_zone=$(K8S_NODE_ZONE),cloud.region=$(K8S_NODE_REGION)

