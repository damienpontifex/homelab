apiVersion: admissionregistration.k8s.io/v1alpha1 # or v1beta1 depending on cluster version
kind: MutatingAdmissionPolicy
metadata:
  name: inject-otel-endpoint
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: "object.spec.containers.map(c, \n  // Check if the container already has this env variable to prevent duplicates\n  has(c.env) && c.env.exists(e, e.name == \"OTEL_EXPORTER_OTLP_ENDPOINT\") ? c : \n  c + {\n    env: (has(c.env) ? c.env : []) + [{\n      name: \"OTEL_EXPORTER_OTLP_ENDPOINT\",\n      value: \"http://opentelemetry-collector-agent.monitoring.svc.cluster.local\"\n    }]\n  }\n)\n"
---
apiVersion: admissionregistration.k8s.io/v1alpha1 # or v1beta1 depending on cluster version
kind: MutatingAdmissionPolicyBinding
metadata:
  name: inject-otel-endpoint-binding
spec:
  policyName: inject-otel-endpoint
  matchResources:
    namespaceSelector:
      matchExpressions:
        # Exclude core infrastructure spaces
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "opentelemetry"]

