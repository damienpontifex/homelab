# yaml-language-server: $schema=https://github.com/adobe-platform/kubernetes-json-schema/raw/refs/heads/master/master-standalone/certificate-cert-manager-v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: damien@pontifex.dev
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          azureDNS:
            hostedZoneName: pontifex.dev
            resourceGroupName: pontifex.dev
            subscriptionID: fa2cbf67-1293-4f9c-8884-a0379a9e0c64
            environment: AzurePublicCloud
