domainFilters:
  - pontifex.dev

# logLevel: debug
logFormat: json

sources:
  - service

registry: noop
triggerLoopOnEvent: true
interval: 5m

serviceMonitor:
  enabled: true

env:
  - name: AZURE_CLIENT_ID
    value: d7de2e8c-fcf7-4ccd-9c8e-691986669ebd
  - name: AZURE_TENANT_ID
    value: ff2b9041-8733-4fbd-a4e6-23f30567c4a4
  - name: AZURE_FEDERATED_TOKEN_FILE
    value: /var/run/secrets/azure/tokens/token
  - name: AZURE_AUTHORITY_HOST
    value: https://microsoftonline.com
extraVolumes:
  - name: azure-identity-token
    projected:
      sources:
        - serviceAccountToken:
            audience: api://AzureADTokenExchange
            expirationSeconds: 3600
            path: token
  - name: azure-config-file
    configMap:
      name: azure-config-file
    
extraVolumeMounts:
  - name: azure-identity-token
    mountPath: /var/run/secrets/azure/tokens
    readOnly: true
  - name: azure-config-file
    mountPath: /etc/kubernetes
    readOnly: true

provider:
  name: azure
