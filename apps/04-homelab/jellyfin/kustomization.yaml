apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: jellyfin

namespace: jellyfin

labels:
  - pairs:
      app.kubernetes.io/name: jellyfin
    includeSelectors: true

helmCharts:
  - name: jellyfin
    repo: https://jellyfin.github.io/jellyfin-helm
    version: 3.2.0
    namespace: jellyfin
    releaseName: jellyfin
    valuesFile: jellyfin.values.yaml
