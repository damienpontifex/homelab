apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  labels:
    app.kubernetes.io/name: matter-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: matter-server
      labels:
        app.kubernetes.io/name: matter-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.4.0
          args:
            - --storage-path=/data
            - --log-level=info
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - SYS_ADMIN
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 5580
          volumeMounts:
            - name: matter-data
              mountPath: /data
      restartPolicy: Always
      volumes:
        - name: matter-data
          persistentVolumeClaim:
            claimName: matter-server-pvc

