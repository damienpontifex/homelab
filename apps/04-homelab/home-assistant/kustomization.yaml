apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: home-assistant

namespace: home-assistant

labels:
  - pairs:
      app.kubernetes.io/name: home-assistant
    includeSelectors: true

configMapGenerator:
  - name: init-script
    files:
      - init.sh
  - name: git-push
    files:
      - git-push.sh

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - storage.yaml
  - certificate.yaml
  - git-push-cronjob.yaml
  - matter-server/deployment.yaml
  - matter-server/service.yaml
  - matter-server/pvc.yaml
