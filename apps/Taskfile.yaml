# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  apply-azure-resources:
    cmds:
      - |
        az deployment group create
          --name homelab
          --resource-group homelab
          --template-file homelab.bicep
          --query 'properties.outputs'
          | jq 'map_values(.value)'

  plan-azure-resources:
    cmds:
      - |
        az deployment group what-if
          --resource-group homelab
          --template-file homelab.bicep

  # e.g. APP_PATH=apps/03-monitoring/grafana task dev
  dev:
    desc: Local dev and iteration on an app
    requires:
      vars:
        - APP_PATH
    set:
      - x
    vars:
      ARGOCD_APP:
        sh: yq --exit-status '.metadata.name' < "{{.APP_PATH}}/application.yaml"
    cmds:
      # Resume self heal and sync git state again
      - defer: |
          argcd app set argocd/{{.ARGOCD_APP}} --self-heal --app-namespace argocd
          && argocd app sync argocd/{{.ARGOCD_APP}} --app-namespace argocd --async

      - argocd login --core

      # Disable self heal so local tweaks will persist
      - argocd app set argocd/{{.ARGOCD_APP}} --self-heal=false --app-namespace argocd || true

      - |
        watchexec --watch "{{.APP_PATH}}" --ignore charts \
          'kubectl kustomize --enable-helm {{.APP_PATH}} | kubectl apply --server-side=true --force-conflicts --filename -'

  dev-otel-collector:
    cmds:
      - task: dev
        vars:
          APP_PATH: ./03-monitoring/opentelemetry-collector

  dev-home-assistant:
    cmds:
      - task: dev
        vars:
          APP_PATH: ./04-homelab/home-assistant
