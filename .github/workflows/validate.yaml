name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubect-validate
        run: go install sigs.k8s.io/kubectl-validate@latest

      - name: Validate kustomizations
        run: scripts/validate-resources.sh
